name: Build Anytime scan DUB APK

on:
  push:
    branches:
      - build/anytime-scan-search-filter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dub:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android toolchain
        run: scripts/dist/install-sdk.sh

      - name: Restore pinned JNI inputs
        run: scripts/restore-build-inputs.sh

      - name: Compile arm64 DUB APK
        run: |
          ./gradlew             :Common:assembleMobileReleasedub             -PjugglucoAbi=arm64-v8a             --no-daemon             --stacktrace

      - name: Upload DUB APK
        uses: actions/upload-artifact@v7
        with:
          name: JugglucoNG-anytime-scan-search-filter-dub-arm64
          path: Common/build/outputs/apk/mobile/releasedub/*.apk
          if-no-files-found: error
          retention-days: 7
